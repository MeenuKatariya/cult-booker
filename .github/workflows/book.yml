name: Book cult class

on:
  schedule:
    # Window opens 22:00 IST. GitHub cron drifts 5-30 min under load, so fire early and
    # let the job camp. Second entry covers a dropped run; concurrency skips it if the
    # first is still camping.
    - cron: '15 15 * * *' # 20:45 IST — 75 min of slack before the window
    - cron: '45 15 * * *' # 21:15 IST — backup, 45 min of slack
  workflow_dispatch:

concurrency:
  group: cult-booker
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    # 20:45 start + camp to 22:30 is ~105 min; the rest is slack for cron drift.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node index.js run
        env:
          CURL_COMMAND: ${{ secrets.CURL_COMMAND }}
          DRY_RUN: ${{ vars.DRY_RUN }}
