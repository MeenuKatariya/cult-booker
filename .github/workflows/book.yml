name: Book cult class

on:
  schedule:
    # Window opens 22:00 IST. GitHub's scheduler drifts 5-30 min under load, so this fires
    # two hours early and the job camps. One entry, not two: a backup cron either cancels
    # the run already camping or queues behind it and camps into the next day.
    - cron: '30 14 * * *' # 20:00 IST
  workflow_dispatch:

concurrency:
  group: cult-booker
  cancel-in-progress: true

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: node index.js run
        env:
          CURL_COMMAND: ${{ secrets.CURL_COMMAND }}
          DRY_RUN: ${{ vars.DRY_RUN }}
